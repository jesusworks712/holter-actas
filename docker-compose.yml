services:
  db:
    image: postgres:16
    container_name: holter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-holter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debes definir DB_PASSWORD en el .env}
      POSTGRES_DB: ${DB_NAME:-holter_actas}
    ports:
      - "5432:5432"
    volumes:
      - holter_pgdata:/var/lib/postgresql/data
volumes:
  holter_pgdata: